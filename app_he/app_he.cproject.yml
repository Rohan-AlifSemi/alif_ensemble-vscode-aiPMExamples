# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/tools/projmgr/2.12.0/tools/projmgr/schemas/cproject.schema.json
project:
  groups:
    - group: App
      files:
        - file: main.c
        - file: get_int_input.c
        - file: ../app_common/go_modes.c
        - file: ../app_common/ready_modes.c
        - file: ../app_common/idle_modes.c
        - file: ../app_common/standby_modes.c
        - file: ../app_common/stop_modes.c

  add-path:
    - ../app_common

  output:
    base-name: $Project$
    type:
      - elf
      - bin

  layers:
    - layer: $DeviceLayer$
    - layer: $DriverLayer$